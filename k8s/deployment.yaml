apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp3
spec:
  strategy:
    type: Recreate  
  replicas: 5
  selector:
    matchLabels:
      app: myapp3
  template:
    metadata:
      labels:
        app: myapp3
    spec:
      containers:
      - name: myapp3
        image: nginx
        ports:
        - containerPort: 80

