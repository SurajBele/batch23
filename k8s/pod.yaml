apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app: my1stapp
spec:
  containers:
  - name: myapp
    image: surajbele/batch23:httpd-v1
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: myapp
spec:
  selector:
    app: my1stapp
  ports:
  - port: 80
    targetPort: 80


